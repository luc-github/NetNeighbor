# Build release artifacts when a version tag is pushed (v*).
# Linux: full GTK 1.x chain (.deb, tar.gz, AppImage, checksums).
# Windows / macOS: PyInstaller skeletons, entry app.py (continue-on-error until validated locally).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          ref="${GITHUB_REF_NAME}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Build Linux artifacts
        run: |
          chmod +x packaging/linux/*.sh packaging/checksums.sh
          ./packaging/linux/release.sh "${{ needs.version.outputs.version }}"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ needs.version.outputs.version }}
          path: |
            dist/netneighbor_*.deb
            dist/netneighbor-*.tar.gz
            dist/NetNeighbor-*.AppImage
            dist/SHA256SUMS-*.txt

  windows:
    needs: version
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Windows bundle
        run: |
          python -m pip install -r requirements-qt.txt pyinstaller
          .\packaging\windows\build.ps1 -Version ${{ needs.version.outputs.version }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ needs.version.outputs.version }}
          path: |
            dist/NetNeighbor/
            dist/NetNeighbor-*-win64.zip

  macos:
    needs: version
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build macOS app bundle
        run: |
          python3 -m pip install -r requirements-qt.txt pyinstaller
          bash packaging/macos/build_app.sh "${{ needs.version.outputs.version }}"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ needs.version.outputs.version }}
          path: |
            dist/NetNeighbor.app
            dist/NetNeighbor-*-macos.zip

  github-release:
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    if: always() && needs.linux.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Flatten release files
        run: |
          mkdir -p dist-flat
          find release-assets -type f \( \
            -name '*.deb' -o -name '*.tar.gz' -o -name '*.AppImage' -o \
            -name '*.zip' -o -name 'SHA256SUMS-*.txt' \
          \) -exec cp {} dist-flat/ \;

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist-flat/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
